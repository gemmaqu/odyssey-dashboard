services:
  postgres:
    image: postgres:16-alpine
    container_name: odyssey_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: odyssey
      POSTGRES_PASSWORD: odyssey
      POSTGRES_DB: odyssey
    ports:
      - "5432:5432"
    volumes:
      - odyssey_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odyssey -d odyssey"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  odyssey_pgdata:
