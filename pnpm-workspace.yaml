packages:
  - "apps/*"
  - "services/*"
  - "packages/*"
# Single React / React Native / types across the workspace (Expo SDK 57).
overrides:
  react: 19.2.3
  react-dom: 19.2.3
  react-native: 0.86.3
  "@types/react": ~19.2.2
allowBuilds:
  '@scarf/scarf': false
  esbuild: true
  sharp: true
  workerd: true
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.23'
  - '@expo/metro-file-map@57.0.3'
  - '@expo/ui@57.0.17'
  - babel-preset-expo@57.0.11
  - expo-glass-effect@57.0.2
  - expo-modules-core@57.0.17
  - expo-modules-jsi@57.1.0
  - expo-router@57.0.20
  - expo@57.0.21
